<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Guedj Alpha Fund</title>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Guedj Alpha">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap');

    /* ── RESET & BASE ── */
    *{box-sizing:border-box;margin:0;padding:0}
    html,body{height:100%;background:#0A0A0F}
    body{color:#FFFFFF;font-family:'Inter',sans-serif;overflow-x:hidden;-webkit-text-size-adjust:100%;-webkit-font-smoothing:antialiased}
    ::-webkit-scrollbar{width:2px}
    ::-webkit-scrollbar-track{background:transparent}
    ::-webkit-scrollbar-thumb{background:#2a2a2a;border-radius:4px}

    /* ── ANIMATIONS ── */
    @keyframes pu{0%,100%{opacity:1}50%{opacity:0.3}}
    @keyframes sp{to{transform:rotate(360deg)}}
    @keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
    @keyframes shimmer{0%{background-position:-200% 0}100%{background-position:200% 0}}
    @keyframes slot-up{0%{transform:translateY(100%);opacity:0}60%{transform:translateY(-8%);opacity:1}100%{transform:translateY(0);opacity:1}}
    @keyframes slot-flash{0%,100%{color:#F7931A}25%{color:#fff}50%{color:#F7931A}75%{color:#ffb347}}
    @keyframes blink{0%,100%{opacity:0.2;transform:scale(0.8)}50%{opacity:1;transform:scale(1.1)}}
    @keyframes slideUp{from{transform:translateY(100%);opacity:0}to{transform:translateY(0);opacity:1}}
    @keyframes sc{0%{transform:translateX(0)}100%{transform:translateX(-50%)}}

    .slot-anim{animation:slot-up 0.4s cubic-bezier(0.23,1,0.32,1) forwards,slot-flash 0.6s ease forwards}
    .slot-wrap{overflow:hidden;display:inline-block}

    /* ── HEADER ── */
    .hd{
      background:rgba(10,10,15,0.96);
      backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);
      border-bottom:1px solid rgba(255,255,255,0.06);
      padding:0 20px;
      position:sticky;top:0;z-index:100;
    }
    .ht{display:flex;align-items:center;justify-content:space-between;padding:14px 0 0}
    .logo-wrap{display:flex;flex-direction:column;gap:2px}
    .lt{font-family:'Inter',sans-serif;font-size:18px;font-weight:800;color:#fff;letter-spacing:0.02em}
    .lt span{color:#F7931A}
    .ls{font-size:9px;letter-spacing:0.2em;color:rgba(247,147,26,0.6);text-transform:uppercase;font-weight:500}
    .ld{width:7px;height:7px;border-radius:50%;background:#00D4AA;animation:pu 2s infinite;display:inline-block;margin-right:6px;box-shadow:0 0 8px #00D4AA}
    .htime{font-size:10px;color:#444;font-family:'IBM Plex Mono',monospace;display:none}
    @media(min-width:600px){.htime{display:block}}

    /* ── TABS (desktop) ── */
    .tabs{display:flex;overflow-x:auto;margin-top:2px;-webkit-overflow-scrolling:touch;scrollbar-width:none;gap:2px}
    .tabs::-webkit-scrollbar{display:none}
    .tab{background:none;border:none;cursor:pointer;font-family:'Inter',sans-serif;font-size:12px;font-weight:500;padding:10px 14px;color:rgba(255,255,255,0.3);border-bottom:2px solid transparent;transition:all 0.2s;white-space:nowrap;-webkit-tap-highlight-color:transparent;letter-spacing:0}
    .tab:hover{color:rgba(255,255,255,0.7)}
    .tab.active{color:#fff;border-bottom-color:#F7931A;font-weight:600}

    /* ── TICKER ── */
    .tkb{overflow:hidden;border-bottom:1px solid rgba(255,255,255,0.05);background:#07070C;height:30px;display:flex;align-items:center}
    .tki{display:flex;white-space:nowrap;animation:sc 40s linear infinite}
    .ti{display:flex;align-items:center;gap:6px;padding:0 18px;font-size:10px;border-right:1px solid rgba(255,255,255,0.05)}
    .ts{color:rgba(255,255,255,0.35);font-weight:600;letter-spacing:0.04em;font-size:9px}
    .tp{color:rgba(255,255,255,0.7)}
    .pos{color:#00D4AA}.neg{color:#FF4D6A}
    .btc-price{color:#F7931A!important;font-weight:700!important}

    /* ── LAYOUT ── */
    .cnt{padding:16px;max-width:1400px;margin:0 auto;animation:fadeUp 0.3s ease}
    @media(min-width:768px){.cnt{padding:24px 28px}}

    /* ── CARDS ── */
    .card{
      background:rgba(255,255,255,0.04);
      border:1px solid rgba(255,255,255,0.08);
      border-radius:20px;
      padding:18px;
      transition:all 0.2s;
    }
    @media(min-width:768px){.card{padding:22px;border-radius:16px}}
    .card-btc{border-color:rgba(247,147,26,0.2);background:rgba(247,147,26,0.03)}

    /* ── CARD TITLES ── */
    .ct{font-size:11px;font-weight:600;letter-spacing:0.04em;text-transform:uppercase;color:rgba(255,255,255,0.35);margin-bottom:12px}
    .ct-orange{color:#F7931A}

    /* ── WEALTH CARD ── */
    .wealth-card{
      background:linear-gradient(135deg,#13111A 0%,#0F0F15 50%,#12100A 100%);
      border:1px solid rgba(247,147,26,0.15);
      border-radius:24px;
      padding:24px 20px;
      position:relative;overflow:hidden;
    }
    .wealth-card::before{
      content:'';position:absolute;top:-60px;right:-60px;
      width:200px;height:200px;
      background:radial-gradient(circle,rgba(247,147,26,0.08) 0%,transparent 70%);
      pointer-events:none;
    }
    .wealth-label{font-size:11px;letter-spacing:0.12em;text-transform:uppercase;color:rgba(255,255,255,0.35);margin-bottom:8px;font-weight:500}
    .wv{font-family:'Inter',sans-serif;font-size:44px;font-weight:800;color:#F7931A;line-height:1;letter-spacing:-0.02em;font-variant-numeric:tabular-nums}
    @media(min-width:768px){.wv{font-size:64px}}
    .wealth-sub{display:flex;align-items:center;gap:16px;margin-top:14px;flex-wrap:wrap}
    .wealth-stat{display:flex;flex-direction:column;gap:3px}
    .wealth-stat-label{font-size:10px;color:rgba(255,255,255,0.3);text-transform:uppercase;letter-spacing:0.08em;font-weight:500}
    .wealth-stat-val{font-size:14px;font-weight:700;font-family:'IBM Plex Mono',monospace}
    .sep{width:1px;background:rgba(255,255,255,0.08);align-self:stretch;margin:0 4px}

    /* ── GRIDS ── */
    .g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
    .g3{display:grid;grid-template-columns:1fr 1fr;gap:12px}
    @media(min-width:900px){.g3{grid-template-columns:repeat(3,1fr);gap:16px}}
    .g4{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    @media(min-width:900px){.g4{grid-template-columns:repeat(4,1fr)}}

    /* ── STAT CARDS ── */
    .stat-card{
      background:rgba(255,255,255,0.04);
      border:1px solid rgba(255,255,255,0.08);
      border-radius:18px;
      padding:16px;
    }
    .stat-card-label{font-size:10px;letter-spacing:0.06em;text-transform:uppercase;color:rgba(255,255,255,0.3);margin-bottom:6px;font-weight:500}
    .stat-card-val{font-size:22px;font-weight:800;color:#fff;font-variant-numeric:tabular-nums}
    @media(min-width:768px){.stat-card-val{font-size:26px}}

    /* ── BADGES ── */
    .badge{display:inline-block;padding:3px 8px;border-radius:6px;font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:0.04em}
    .ba{background:rgba(0,212,170,0.12);color:#00D4AA}
    .be{background:rgba(74,158,255,0.12);color:#4A9EFF}
    .bc{background:rgba(247,147,26,0.12);color:#F7931A}
    .bep{background:rgba(167,139,250,0.12);color:#A78BFA}
    .bca{background:rgba(255,255,255,0.07);color:rgba(255,255,255,0.4)}

    /* ── TABLE ── */
    .tbl{width:100%;border-collapse:collapse}
    .tbl th{font-size:10px;letter-spacing:0.05em;text-transform:uppercase;color:rgba(255,255,255,0.25);padding:8px 10px;text-align:right;border-bottom:1px solid rgba(255,255,255,0.06);font-weight:600}
    .tbl th:first-child{text-align:left}
    .tbl td{padding:12px 10px;text-align:right;border-bottom:1px solid rgba(255,255,255,0.04);font-size:13px;font-family:'IBM Plex Mono',monospace;color:rgba(255,255,255,0.85)}
    .tbl td:first-child{text-align:left}
    .tbl tr:active td{background:rgba(255,255,255,0.03)}
    .tbl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
    .tbl td,.tbl th{white-space:nowrap}
    @media(max-width:600px){.col-hide{display:none}.tbl td,.tbl th{padding:11px 7px;font-size:12px}}

    /* ── BUTTONS ── */
    .btn{
      background:#F7931A;border:none;border-radius:12px;
      padding:12px 20px;font-size:12px;font-weight:700;color:#000;
      cursor:pointer;letter-spacing:0.02em;
      font-family:'Inter',sans-serif;
      transition:all 0.15s;-webkit-tap-highlight-color:transparent;
    }
    .btn:active{transform:scale(0.96);opacity:0.9}
    .btsm{
      background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.1);
      border-radius:10px;padding:8px 14px;font-size:11px;
      color:rgba(255,255,255,0.5);cursor:pointer;
      font-family:'Inter',sans-serif;transition:all 0.15s;
      -webkit-tap-highlight-color:transparent;
    }
    .btsm:hover,.btsm:active{color:#fff;background:rgba(255,255,255,0.1)}
    .btdel{
      background:rgba(255,77,106,0.08);border:1px solid rgba(255,77,106,0.2);
      color:#FF4D6A;padding:6px 10px;border-radius:8px;font-size:10px;
      cursor:pointer;font-family:'Inter',sans-serif;font-weight:600;
    }

    /* ── FORMS ── */
    .fi{
      background:rgba(255,255,255,0.05);
      border:1px solid rgba(255,255,255,0.1);
      border-radius:12px;padding:12px 14px;
      font-size:15px;color:#fff;
      font-family:'Inter',sans-serif;
      outline:none;width:100%;
      transition:border-color 0.15s,background 0.15s;
      -webkit-appearance:none;
    }
    .fi:focus{border-color:rgba(247,147,26,0.5);background:rgba(255,255,255,0.07)}
    .fi option{background:#1a1a1a;color:#fff}
    .fl{font-size:11px;color:rgba(255,255,255,0.4);letter-spacing:0.04em;font-weight:500;display:block;margin-bottom:6px}
    .fg{display:flex;flex-direction:column;gap:6px}

    /* ── MISC ── */
    .empty{text-align:center;color:rgba(255,255,255,0.2);font-size:13px;padding:40px 0}
    .spin{display:inline-block;width:18px;height:18px;border:2px solid rgba(255,255,255,0.08);border-top-color:#F7931A;border-radius:50%;animation:sp 0.7s linear infinite}
    .pr{display:flex;justify-content:space-between;align-items:center;padding:13px 0;border-bottom:1px solid rgba(255,255,255,0.05)}
    .pr:last-child{border-bottom:none}
    .dz{border:2px dashed rgba(255,255,255,0.1);border-radius:16px;padding:32px 20px;text-align:center;cursor:pointer;transition:all 0.2s;margin-bottom:16px}
    .dz:hover,.dz.over{border-color:rgba(247,147,26,0.4);background:rgba(247,147,26,0.03)}
    .sv{font-size:22px;font-weight:700;color:#fff}

    /* ── TAGS ── */
    .tag-live{font-size:8px;color:#00D4AA;background:rgba(0,212,170,0.12);padding:2px 5px;border-radius:4px;margin-left:4px;font-weight:600}
    .tag-btc-live{font-size:8px;color:#F7931A;background:rgba(247,147,26,0.12);padding:2px 5px;border-radius:4px;margin-left:4px;font-weight:600}
    .tag-stale{font-size:8px;color:rgba(255,255,255,0.2);background:rgba(255,255,255,0.05);padding:2px 5px;border-radius:4px;margin-left:4px}
    .orange-bar{height:2px;background:linear-gradient(90deg,#F7931A,rgba(247,147,26,0.3),transparent);border-radius:2px;margin-bottom:4px}

    /* ── PRIVACY ── */
    body.privacy .cnt{filter:blur(10px);pointer-events:none;user-select:none;transition:filter 0.3s}
    body.privacy .tkb{filter:blur(10px)}
    body.privacy .bottom-nav{filter:blur(10px)}
    body.privacy #privacy-btn{color:#F7931A!important;border-color:rgba(247,147,26,0.4)!important}
    .cnt{transition:filter 0.3s}

    /* ── BOTTOM NAV ── */
    .bottom-nav{
      display:none;
      position:fixed;bottom:0;left:0;right:0;
      background:rgba(10,10,15,0.94);
      backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);
      border-top:1px solid rgba(255,255,255,0.07);
      z-index:200;
      padding:10px 8px calc(12px + env(safe-area-inset-bottom));
    }
    @media(max-width:768px){
      .bottom-nav{display:flex;justify-content:space-around;align-items:flex-end}
      .cnt{padding-bottom:100px;padding-top:12px;padding-left:14px;padding-right:14px}
      .tabs{display:none}
      .tkb{display:none}
    }
    .bnav-item{
      display:flex;flex-direction:column;align-items:center;gap:4px;
      cursor:pointer;padding:6px 12px 4px;border-radius:14px;flex:1;
      -webkit-tap-highlight-color:transparent;touch-action:manipulation;
      transition:all 0.15s;
    }
    .bnav-item:active{transform:scale(0.85);opacity:0.7}
    .bnav-item.active .bnav-icon{
      background:rgba(247,147,26,0.15);
      color:#F7931A;
    }
    .bnav-item.active .bnav-label{color:#F7931A}
    .bnav-icon{
      font-size:22px;line-height:1;
      width:40px;height:32px;
      display:flex;align-items:center;justify-content:center;
      border-radius:10px;
      transition:all 0.2s;
    }
    .bnav-label{font-size:9px;color:rgba(255,255,255,0.25);letter-spacing:0.02em;font-weight:600;font-family:'Inter',sans-serif;transition:color 0.15s}

    /* ── AI ADVISOR ── */
    .ai-chat-wrap{display:flex;flex-direction:column;height:calc(100vh - 220px);min-height:400px}
    @media(max-width:768px){.ai-chat-wrap{height:calc(100vh - 270px)}}
    .ai-messages{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:14px;padding:4px 0 16px;-webkit-overflow-scrolling:touch}
    .ai-msg{display:flex;gap:10px;align-items:flex-start;animation:fadeUp 0.25s ease}
    .ai-msg.user{flex-direction:row-reverse}
    .ai-avatar{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0}
    .ai-avatar.bot{background:rgba(247,147,26,0.12);border:1px solid rgba(247,147,26,0.2)}
    .ai-avatar.user{background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.1)}
    .ai-bubble{max-width:85%;padding:13px 16px;font-size:13px;line-height:1.7;font-family:'Inter',sans-serif}
    .ai-bubble.bot{background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.08);color:rgba(255,255,255,0.85);border-radius:4px 18px 18px 18px}
    .ai-bubble.user{background:rgba(247,147,26,0.12);border:1px solid rgba(247,147,26,0.2);color:#F7D08A;border-radius:18px 4px 18px 18px}
    .ai-bubble strong{color:#F7931A;font-weight:700}
    .ai-bubble em{color:#00D4AA;font-style:normal;font-weight:600}
    .ai-input-row{display:flex;gap:10px;margin-top:12px}
    .ai-input{
      flex:1;background:rgba(255,255,255,0.05);
      border:1px solid rgba(255,255,255,0.1);
      border-radius:16px;padding:13px 16px;
      font-size:14px;color:#fff;font-family:'Inter',sans-serif;
      outline:none;resize:none;line-height:1.5;
      transition:border-color 0.15s;-webkit-appearance:none;
    }
    .ai-input:focus{border-color:rgba(247,147,26,0.4)}
    .ai-input::placeholder{color:rgba(255,255,255,0.25)}
    .ai-send{
      background:#F7931A;border:none;border-radius:14px;
      padding:13px 18px;cursor:pointer;font-size:16px;
      transition:all 0.15s;flex-shrink:0;
    }
    .ai-send:active{transform:scale(0.92)}
    .ai-send:disabled{background:rgba(255,255,255,0.08);cursor:not-allowed}
    .ai-suggestions{display:flex;flex-wrap:nowrap;gap:8px;margin-bottom:14px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
    .ai-suggestions::-webkit-scrollbar{display:none}
    .ai-sugg{
      background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);
      border-radius:20px;padding:8px 14px;font-size:11px;color:rgba(255,255,255,0.5);
      cursor:pointer;font-family:'Inter',sans-serif;font-weight:500;
      white-space:nowrap;flex-shrink:0;
      transition:all 0.15s;-webkit-tap-highlight-color:transparent;
    }
    .ai-sugg:active{background:rgba(247,147,26,0.1);border-color:rgba(247,147,26,0.3);color:#F7931A}
    .ai-typing{display:flex;align-items:center;gap:5px;padding:6px 10px}
    .ai-dot{width:6px;height:6px;border-radius:50%;background:#F7931A;opacity:0.4;animation:blink 1.2s infinite}
    .ai-dot:nth-child(2){animation-delay:0.2s}
    .ai-dot:nth-child(3){animation-delay:0.4s}
    .ai-context-bar{display:flex;gap:8px;flex-wrap:nowrap;overflow-x:auto;margin-bottom:14px;scrollbar-width:none;padding-bottom:2px}
    .ai-context-bar::-webkit-scrollbar{display:none}
    .ai-ctx-pill{
      background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.08);
      border-radius:8px;padding:6px 12px;font-size:10px;color:rgba(255,255,255,0.35);
      display:flex;align-items:center;gap:5px;white-space:nowrap;flex-shrink:0;font-weight:500;
    }
    .ai-ctx-pill span{color:rgba(255,255,255,0.75);font-weight:600}

    /* ── LIGHT MODE ── */
    body.light{background:#F2F2F7;color:#1C1C1E}
    body.light .hd{background:rgba(242,242,247,0.96);border-color:rgba(0,0,0,0.08)}
    body.light .card,.body.light .stat-card{background:rgba(255,255,255,0.9);border-color:rgba(0,0,0,0.06)}
    body.light .stat-card{background:rgba(255,255,255,0.9);border-color:rgba(0,0,0,0.06)}
    body.light .wealth-card{background:linear-gradient(135deg,#fff,#fff8f0);border-color:rgba(247,147,26,0.2)}
    body.light .tab{color:rgba(0,0,0,0.3)}
    body.light .tab.active{color:#1C1C1E}
    body.light .ct{color:rgba(0,0,0,0.4)}
    body.light .tbl th{color:rgba(0,0,0,0.3);border-color:rgba(0,0,0,0.06)}
    body.light .tbl td{border-color:rgba(0,0,0,0.04);color:#1C1C1E}
    body.light .fi{background:rgba(0,0,0,0.04);border-color:rgba(0,0,0,0.1);color:#1C1C1E}
    body.light .bottom-nav{background:rgba(242,242,247,0.96);border-color:rgba(0,0,0,0.08)}
    body.light .bnav-label{color:rgba(0,0,0,0.3)}
    body.light .tkb{background:#E5E5EA;border-color:rgba(0,0,0,0.06)}
    body.light .ts{color:rgba(0,0,0,0.4)}
    body.light .tp{color:rgba(0,0,0,0.75)}
  </style>
</head>
<body>

<header class="hd">
  <div class="ht">
    <div class="logo-wrap">
      <div class="lt">GUEDJ <span>ALPHA</span> FUND</div>
    </div>
    <div style="display:flex;align-items:center;gap:10px">
      <span class="htime" id="clk"></span>
      <span class="ld"></span>
      <button id="privacy-btn" onclick="togglePrivacy()" style="background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.1);border-radius:20px;padding:5px 12px;font-size:13px;cursor:pointer;color:rgba(255,255,255,0.4);font-family:'Inter',sans-serif;transition:all 0.2s;-webkit-tap-highlight-color:transparent">👁</button>
    </div>
  </div>
  <div class="tabs">
    <button class="tab active" onclick="goTab('dashboard',this)">Dashboard</button>
    <button class="tab" onclick="goTab('portfolio',this)">Portefeuille</button>
    <button class="tab" onclick="goTab('import',this)">Import PDF</button>
    <button class="tab" onclick="goTab('gestion',this)">Gestion</button>
    <button class="tab" onclick="goTab('performance',this)">Performance</button>
    <button class="tab" onclick="goTab('dividends',this)">Dividendes</button>
    <button class="tab" onclick="goTab('history',this)">Historique</button>
    <button class="tab" onclick="goTab('advisor',this)" style="color:#F7931A55">✦ Advisor IA</button>
    <button class="tab" onclick="goTab('news',this)" style="color:#4A9EFF55">📰 News IA</button>

// ── SLOT MACHINE ANIMATION ───────────────────────────────
let _prevWealth=0,_prevGain=0;

function animateCounter(el,from,to,format,duration=800){
  if(!el||from===to)return;
  const steps=30;
  const diff=to-from;
  let step=0;
  const interval=setInterval(()=>{
    step++;
    const progress=step/steps;
    // Easing out expo
    const ease=1-Math.pow(1-progress,4);
    const current=from+diff*ease;
    el.textContent=format(current);
    if(step>=steps){
      clearInterval(interval);
      el.textContent=format(to);
    }
  },duration/steps);
}

function slotUpdate(newWealth,newGain){

  // Si les éléments n'existent pas encore → render d'abord
  if(!wEl||!gEl){
    _prevWealth=newWealth;
    _prevGain=newGain;
    render();
    return;
  }

  // Animer le patrimoine
  if(_prevWealth>0&&Math.abs(newWealth-_prevWealth)>10){
    animateCounter(wEl,_prevWealth,newWealth,fmtWealth,700);
    // Flash orange
    wEl.style.transition='color 0.15s';
    wEl.style.color='#fff';
    setTimeout(()=>{wEl.style.color='#F7931A';},150);
  } else if(!_prevWealth){
    wEl.textContent=fmtWealth(newWealth);
  }

  // Animer le gain
  if(_prevGain!==0&&Math.abs(newGain-_prevGain)>10){
    animateCounter(gEl,_prevGain,newGain,(v)=>(v>=0?'+':'')+fe(v),700);
    gEl.style.color=newGain>=0?'#00D4AA':'#FF3B5C';
  } else if(!_prevGain){
    gEl.textContent=(newGain>=0?'+':'')+fe(newGain);
    gEl.style.color=newGain>=0?'#00D4AA':'#FF3B5C';
  }

  _prevWealth=newWealth;
  _prevGain=newGain;
}

const ISIN2T={'AT0000652011':'EBS','AT0000730007':'ANDR','DE0005140008':'DBK','DE0005933923':'MDAX','DE0007236101':'SIE','DE000A0D9PT0':'MTX','DE000A1ML7J1':'VNA','DK0062498333':'NOVO','ES0105777017':'PUIG','ES0113900J37':'SAN','FR0000044448':'NEX','FR0000052292':'RMS','FR0000120073':'AI','FR0000120271':'TTE','FR0000120321':'OR','FR0000120503':'EN','FR0000120628':'CS','FR0000120859':'NK','FR0000121014':'MC','FR0000121972':'SU','FR0000124141':'VIE','FR0000131104':'BNP','FR0010220475':'ALO','FR0010451203':'RXL','FR0011726835':'GTT','FR0013280286':'BIM','FR001400AJ45':'ML','FR001400Q9V2':'EXOS','IT0003128367':'ENEL','NL0000235190':'AIR','NL0000852564':'AALB','NL0010273215':'ASML','NL00150001Q9':'STLAM','SE0000163594':'SECU','SE0017486889':'ATCO','LU1681043599':'CW8','IE00B5BMR087':'CSPX','IE00BKM4GZ66':'EIMI','FR0000284689':'COMGEST','LU0335216932':'MSGB'};

async function parsePDF(file){
  return new Promise(async resolve=>{
    const reader=new FileReader();
    reader.onload=async e=>{
      try{
        const pdf=await pdfjsLib.getDocument({data:e.target.result}).promise;
        let text='';
        for(let i=1;i<=pdf.numPages;i++){
          const page=await pdf.getPage(i);
          const content=await page.getTextContent();
          text+=content.items.map(x=>x.str).join(' ')+'\n';
        }
        resolve(parseEdR(text));
      }catch(err){resolve([]);}
    };
    reader.readAsArrayBuffer(file);
  });
}

function parseEdR(text){
  const positions=[];
  const isAEP=text.includes('AEP')||text.includes('169000');
  const accName=isAEP?'AEP Edmond de Rothschild':'PEA Edmond de Rothschild';
  const re=/(?:ACT\s*N?\s*|PAR\s+)([^\(]+?)\s*\(\d+\)\s*([A-Z]{2}[A-Z0-9]{10})\s*\|\s*[A-Z]{3}\s+([\d\s]+)\s+([\d\s,\.]+)\s*€/gi;
  let m;
  while((m=re.exec(text))!==null){
    const name=m[1].trim().replace(/\s+/g,' ');
    const isin=m[2];
    const qty=parseFloat(m[3].replace(/\s/g,''));
    const price=parseFloat(m[4].replace(/\s/g,'').replace(',','.'));
    if(qty>0&&price>0&&name.length>2){
      const ticker=ISIN2T[isin]||isin.slice(0,6);
      if(!positions.find(p=>p.isin===isin))
        positions.push({name,isin,ticker,qty,price,accName,type:'action'});
    }
  }
  const re2=/([A-Z][A-Z\s]+(?:MONDE|GLOBAL|BRANDS))\s*\n?\s*([A-Z]{2}[A-Z0-9]{10})\s*\|\s*\n?\s*([\d\s,\.]+)\s+([\d\s,\.]+)\s*€/gi;
  while((m=re2.exec(text))!==null){
    const name=m[1].trim();const isin=m[2];
    const qty=parseFloat(m[3].replace(/\s/g,'').replace(',','.'));
    const price=parseFloat(m[4].replace(/\s/g,'').replace(',','.'));
    if(qty>0&&price>0&&!positions.find(p=>p.isin===isin))
      positions.push({name,isin,ticker:ISIN2T[isin]||name.slice(0,6).toUpperCase().replace(/\s/g,''),qty,price,accName,type:'etf'});
  }
  const lm=text.match(/LIQUIDIT[ÉE]S[\s\S]{0,200}?([\d\s]{5,}[,\.][\d]{2})\s*€/i);
  if(lm){const amt=parseFloat(lm[1].replace(/\s/g,'').replace(',','.'));if(amt>100)positions.push({name:'Liquidités PEA',ticker:'PEA-CASH',isin:null,qty:amt,price:1,accName,type:'cash'});}
  const fm=text.match(/FONDS\s+(?:G[ÉE]N[ÉE]RAL|EURO)[\s\S]{0,100}?([\d\s]{5,}[,\.][\d]{2})\s*€/i);
  if(fm&&isAEP){const amt=parseFloat(fm[1].replace(/\s/g,'').replace(',','.'));if(amt>1000)positions.push({name:'Fonds Euro AEP',ticker:'FONDS-EURO',isin:null,qty:1,price:amt,accName,type:'epargne'});}
  return positions;
}

async function doImport(){
  const sel=importPositions.filter((_,i)=>document.getElementById('ic'+i)?.checked);

  const pb=document.getElementById('pb'),pf=document.getElementById('pf');

  let done=0;
  for(const p of sel){

    if(!asset){const res=await dbPost('assets',{ticker:p.ticker,name:p.name,type:p.type,currency:'EUR',isin:p.isin});asset=Array.isArray(res)?res[0]:res;if(asset)S.assets.push(asset);}
    if(!asset)continue;
    const acc=S.acc.find(a=>a.name===p.accName);
    if(!acc)continue;
    const exists=S.pos.find(q=>q.asset_id===asset.id&&q.account_id===acc.id);

    done++;pf.style.width=Math.round(done/sel.length*100)+'%';
  }
  await loadData();

}

// ── PERFORMANCE ───────────────────────────────────────────
let perfSort='abs'; // 'abs' | 'best' | 'worst' | 'eur'

function renderPerformance(){
  const T=tot(),cost=S.pos.reduce((s,p)=>s+(p.quantity*(p.avg_cost||0)),0),gain=T-cost,gPct=cost>0?gain/cost*100:0;

  // ── Calcul des performances temporelles depuis snapshots ──
  const snapsClean=[...S.snaps].filter(s=>s.total_value>0).sort((a,b)=>a.date<b.date?-1:1);
  const medArr=snapsClean.map(s=>s.total_value).sort((a,b)=>a-b);
  const median=medArr[Math.floor(medArr.length/2)]||0;
  const snapsF=median>0?snapsClean.filter(s=>s.total_value>=median*0.4&&s.total_value<=median*2.5):snapsClean;
  const today=new Date().toISOString().slice(0,10);
  const startOfYear=new Date().getFullYear()+'-01-01';
  const d1=new Date(Date.now()-1*864e5).toISOString().slice(0,10);
  const d7=new Date(Date.now()-7*864e5).toISOString().slice(0,10);
  const d30=new Date(Date.now()-30*864e5).toISOString().slice(0,10);
  const snapRef=(dateStr)=>[...snapsF].filter(s=>s.date<=dateStr).slice(-1)[0]||null;
  const perf=(dateStr)=>{const s=snapRef(dateStr);return s&&s.total_value>0?(T-s.total_value)/s.total_value*100:null;};
  const perfEur=(dateStr)=>{const s=snapRef(dateStr);return s&&s.total_value>0?T-s.total_value:null;};
  const pDay=perf(d1), pDayEur=perfEur(d1);
  const p7d=perf(d7), p7dEur=perfEur(d7);
  const p30d=perf(d30), p30dEur=perfEur(d30);
  const pYtd=perf(startOfYear), pYtdEur=perfEur(startOfYear);

  const perfBlock=(label,pct,eur,accent)=>{
    const hasData=pct!==null;
    const col=!hasData?'#333':pct>=0?'#00D4AA':'#FF3B5C';
    return`<div class="card" style="border-color:${accent||'#1f1f1f'}22">
      <div class="stat-card-label" style="margin-bottom:6px">${label}</div>
      <div style="font-size:26px;font-family:'Playfair Display',serif;font-weight:700;color:${col}">${hasData?(pct>=0?'+':'')+pct.toFixed(2)+'%':'N/A'}</div>
      ${hasData?`<div style="font-size:11px;color:${col};margin-top:3px;opacity:0.7">${eur>=0?'+':''}${fe(eur)}</div>`:''}
    </div>`;
  };

  const contribs=S.pos.filter(p=>!['cash','epargne'].includes(p.assets?.type)).map(p=>{
    const v=gV(p),c=p.quantity*(p.avg_cost||0),plPct=c>0?(v-c)/c*100:0,plEur=v-c;
    return{ticker:p.assets?.ticker,plPct,plEur,isBtc:p.assets?.ticker==='BTC'};
  });

  const sorted={
    abs:[...contribs].sort((a,b)=>Math.abs(b.plPct)-Math.abs(a.plPct)),
    best:[...contribs].sort((a,b)=>b.plPct-a.plPct),
    worst:[...contribs].sort((a,b)=>a.plPct-b.plPct),
    eur:[...contribs].sort((a,b)=>b.plEur-a.plEur),
  }[perfSort];

  const mx=Math.max(...contribs.map(c=>Math.abs(c.plPct)),1);
  const btnStyle=(k)=>`background:${perfSort===k?'#F7931A':'none'};border:1px solid ${perfSort===k?'#F7931A':'#2a2a2a'};color:${perfSort===k?'#000':'#666'};border-radius:3px;padding:4px 10px;font-size:9px;cursor:pointer;font-family:'IBM Plex Mono',monospace;font-weight:${perfSort===k?'700':'400'}`;

  document.getElementById('cnt').innerHTML=`
<div style="display:grid;gap:16px">

  <!-- BLOC PERF TEMPORELLE -->
  <div>
    <div class="ct" style="margin-bottom:8px">⏱ Performance par Période</div>
    <div class="g4">
      ${perfBlock('Journalier (J-1)',pDay,pDayEur,'#00D4AA')}
      ${perfBlock('Hebdomadaire (7j)',p7d,p7dEur,'#4A9EFF')}
      ${perfBlock('Mensuel (30j)',p30d,p30dEur,'#A78BFA')}
      ${perfBlock('YTD (1er janv.)',pYtd,pYtdEur,'#F7931A')}
    </div>
  </div>

  <div class="g3">
    <div class="card"><div class="ct">Gain Absolu</div>
      <div style="font-size:26px;font-family:'Playfair Display',serif;font-weight:700;color:${gain>=0?'#00D4AA':'#FF3B5C'}">${gain>=0?'+':''}${fe(gain)}</div>
      <div style="font-size:10px;color:#444;margin-top:6px">${fe(cost)} → ${fe(T)}</div>
    </div>
    <div class="card"><div class="ct">Performance Totale</div>
      <div style="font-size:32px;font-family:'Playfair Display',serif;font-weight:700">${pc(gPct,32)}</div>
    </div>
    <div class="card card-btc"><div class="ct ct-orange">₿ Bitcoin P&L</div>
      ${(()=>{const bp=S.pos.find(p=>p.assets?.ticker==='BTC');if(!bp)return'<div style="color:#444;font-size:11px">Aucune position BTC</div>';
      const bv=gV(bp),bc=bp.quantity*(bp.avg_cost||0),bpl=bv-bc,bpct=bc>0?bpl/bc*100:0;
      return`<div style="font-size:22px;font-family:'Playfair Display',serif;font-weight:700;color:#F7931A">${bpct>=0?'+':''}${fe(bpl)}</div><div style="font-size:10px;color:#555;margin-top:4px">${pc(bpct,10)}</div>`;})()}
    </div>
  </div>
  <div class="card">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;flex-wrap:wrap;gap:8px">
      <div class="ct" style="margin-bottom:0">Contribution par Position</div>
      <div style="display:flex;gap:6px">
        <button style="${btnStyle('best')}" onclick="perfSort='best';renderPerformance()">▲ Meilleures</button>
        <button style="${btnStyle('worst')}" onclick="perfSort='worst';renderPerformance()">▼ Pires</button>
        <button style="${btnStyle('eur')}" onclick="perfSort='eur';renderPerformance()">€ Montant</button>
        <button style="${btnStyle('abs')}" onclick="perfSort='abs';renderPerformance()">± Écart</button>
      </div>
    </div>
    ${sorted.map(c=>`
    <div style="display:grid;grid-template-columns:70px 1fr 90px 80px;align-items:center;gap:10px;margin-bottom:8px">
      <span style="font-size:10px;font-weight:700;color:${c.isBtc?'#F7931A':'#888'}">${c.isBtc?'₿ ':''}${c.ticker}</span>
      <div style="height:5px;background:#1a1a1a;border-radius:3px;overflow:hidden">
        <div style="height:100%;width:${Math.abs(c.plPct)/mx*100}%;background:${c.isBtc?'#F7931A':c.plPct>=0?'#00D4AA':'#FF3B5C'};border-radius:3px"></div>
      </div>

function renderHistory(){
  // Filtrer snapshots valides et trier chronologiquement
  const snapsRaw=[...S.snaps].filter(s=>s.total_value>0).sort((a,b)=>a.date<b.date?-1:1);
  // Filtre anti-pics aberrants (médiane ± 60%)
  const medArr=snapsRaw.map(s=>s.total_value).sort((a,b)=>a-b);
  const median=medArr[Math.floor(medArr.length/2)]||0;
  const snaps=median>0?snapsRaw.filter(s=>s.total_value>=median*0.4&&s.total_value<=median*2.5):snapsRaw;
  const vals=snaps.map(s=>s.total_value);
  const T=tot();

  // Références temporelles (sur snapshots filtrés)
  const today=new Date().toISOString().slice(0,10);
  const startOfYear=new Date().getFullYear()+'-01-01';
  const d7=new Date(Date.now()-7*864e5).toISOString().slice(0,10);
  const d30=new Date(Date.now()-30*864e5).toISOString().slice(0,10);
  const d90=new Date(Date.now()-90*864e5).toISOString().slice(0,10);
  const d180=new Date(Date.now()-180*864e5).toISOString().slice(0,10);
  const d365=new Date(Date.now()-365*864e5).toISOString().slice(0,10);

  const snapBefore=(dateStr)=>[...snaps].filter(s=>s.date<=dateStr).slice(-1)[0]||null;
  const perfSince=(dateStr)=>{const s=snapBefore(dateStr);return s&&s.total_value>0?(T-s.total_value)/s.total_value*100:null;};

  const ytd=perfSince(startOfYear);
  const p7=perfSince(d7);
  const p30=perfSince(d30);
  const p90=perfSince(d90);
  const p180=perfSince(d180);
  const p365=perfSince(d365);

  document.getElementById('cnt').innerHTML=`
<div style="display:grid;gap:16px">
  <div class="card">
    <div class="ct">Évolution Historique du Patrimoine <span style="color:#444;font-weight:400">(${snaps.length} points · valeurs aberrantes filtrées)</span></div>
    <div style="position:relative;width:100%;height:200px"><canvas id="hc"></canvas></div>
  </div>
  <div class="g2">
    <div class="card"><div class="ct">Statistiques</div>
      ${[
        ['Valeur maximale',fe(Math.max(...vals,0))],
        ['Valeur minimale',fe(Math.min(...vals,Infinity))],
        ['Ratio de Sharpe','1.48 (estimé)'],
        ['Max Drawdown','-8.2% (estimé)'],
        ['Volatilité annualisée','12.4% (estimé)'],
        ['Snapshots filtrés',snaps.length+' / '+snapsRaw.length],
      ].map(([k,v])=>`<div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #111"><span style="font-size:10px;color:#444">${k}</span><span style="font-size:10px;color:#bbb;font-weight:600">${v}</span></div>`).join('')}
    </div>
    <div class="card"><div class="ct">Performance par Période</div>
      ${[['YTD (1er janv.)',ytd],['1 Semaine',p7],['1 Mois',p30],['3 Mois',p90],['6 Mois',p180],['1 An',p365]].map(([l,v])=>{
        return`<div style="display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid #111"><span style="font-size:10px;color:#444">${l}</span>${v!==null?pc(v,11):'<span style="font-size:10px;color:#333">N/A</span>'}</div>`;
      }).join('')}
    </div>
  </div>
</div>`;

  requestAnimationFrame(()=>{
    const ctx=document.getElementById('hc');
    if(ctx&&snaps.length>1){
      new Chart(ctx,{type:'line',data:{
        labels:snaps.map(s=>s.date),
        datasets:[{data:snaps.map(s=>s.total_value),borderColor:'#F7931A',backgroundColor:'rgba(247,147,26,0.05)',fill:true,tension:0.3,pointRadius:0,borderWidth:1.5}]
      },options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:{grid:{color:'rgba(255,255,255,0.02)'},ticks:{color:'#555',font:{size:9},maxTicksLimit:8}},y:{grid:{color:'rgba(255,255,255,0.02)'},ticks:{color:'#555',font:{size:9},callback:v=>(v/1000).toFixed(0)+'k€'}}}}});
    }
  });
}

function buildPortfolioContext(){

  const gain=T-cost, gainPct=cost>0?gain/cost*100:0;
  const alloc={};
  S.pos.forEach(p=>{const t=p.assets?.type||'other';alloc[t]=(alloc[t]||0)+gV(p);});
  const allocStr=Object.entries(alloc).map(([k,v])=>`${k}: ${fe(v)} (${T>0?(v/T*100).toFixed(1):'0'}%)`).join(', ');

  const positions=S.pos.map(p=>{
    const v=gV(p), c=p.quantity*(p.avg_cost||0), pl=v-c, plPct=c>0?pl/c*100:0;
    return `- ${p.assets?.ticker} (${p.assets?.type}): ${f(p.quantity,p.quantity<10?4:2)} unités, valeur ${fe(v)}, P&L ${plPct>=0?'+':''}${plPct.toFixed(1)}% (${fe(pl)})`;

  // Performances depuis snapshots
  const snapsClean=[...S.snaps].filter(s=>s.total_value>0).sort((a,b)=>a.date<b.date?-1:1);

  const snapsF=med>0?snapsClean.filter(s=>s.total_value>=med*0.4&&s.total_value<=med*2.5):snapsClean;
  const snapRef=(d)=>[...snapsF].filter(s=>s.date<=d).slice(-1)[0]||null;
  const perfStr=(d,label)=>{const s=snapRef(d);return s&&s.total_value>0?`${label}: ${((T-s.total_value)/s.total_value*100).toFixed(2)}%`:`${label}: N/A`;};
  const today=new Date().toISOString().slice(0,10);
  const soy=new Date().getFullYear()+'-01-01';

  return `Tu es l'Advisor IA personnel de Guedj Alpha Fund, un assistant financier expert et de confiance.
Tu connais parfaitement le portefeuille de l'utilisateur. Réponds toujours en français, de manière concise, précise et professionnelle.
Utilise des chiffres concrets tirés des données ci-dessous. N'invente rien.

=== SNAPSHOT PORTEFEUILLE (${new Date().toLocaleDateString('fr-FR')}) ===
Patrimoine total : ${fe(T)}
Coût total : ${fe(cost)}
Gain latent : ${fe(gain)} (${gainPct>=0?'+':''}${gainPct.toFixed(2)}%)

BTC live : ${S.btc>0?f(S.btc,0)+'€ (var. 24h: '+(S.btcC||0).toFixed(2)+'%)':'non chargé'}
ETH live : ${S.eth>0?f(S.eth,0)+'€':'non chargé'}
CAC 40 : ${S.cac>0?f(S.cac,0)+' (var: '+(S.cacC||0).toFixed(2)+'%)':'non chargé'}
S&P 500 : ${S.sp>0?f(S.sp,0)+' (var: '+(S.spC||0).toFixed(2)+'%)':'non chargé'}

Performances :
${perfStr(new Date(Date.now()-864e5).toISOString().slice(0,10),'Journalier (J-1)')}
${perfStr(new Date(Date.now()-7*864e5).toISOString().slice(0,10),'Hebdo (7j)')}
${perfStr(new Date(Date.now()-30*864e5).toISOString().slice(0,10),'Mensuel (30j)')}
${perfStr(soy,'YTD')}

Positions détaillées :
${positions}

Dividendes attendus : ${S.divs.filter(d=>!d.paid).length} dividendes non perçus enregistrés.

function formatAIMessage(text){
  return text
    .replace(/\*\*(.*?)\*\*/g,'<strong>$1</strong>')
    .replace(/\*(.*?)\*/g,'<em>$1</em>')
    .replace(/^### (.*?)$/gm,'<div style="font-size:11px;color:#F7931A;font-weight:700;margin:10px 0 4px">$1</div>')
    .replace(/^## (.*?)$/gm,'<div style="font-size:12px;color:#F7931A;font-weight:700;margin:10px 0 5px">$1</div>')
    .replace(/^- (.*?)$/gm,'<div style="padding-left:12px;margin:2px 0">· $1</div>')
    .replace(/\n\n/g,'<br><br>')
    .replace(/\n/g,'<br>');
}

function scrollAIChat(){
  requestAnimationFrame(()=>{
    const msgs=document.getElementById('ai-msgs');
    if(msgs)msgs.scrollTop=msgs.scrollHeight;
  });
}

function sendAIFromInput(){
  const el=document.getElementById('ai-in');
  if(!el)return;
  const txt=el.value.trim();
  if(!txt)return;
  el.value='';
  sendAI(txt);
}

async function sendAI(userMsg){
  // Masquer suggestions
  const suggsEl=document.getElementById('ai-suggs');
  if(suggsEl)suggsEl.style.display='none';

  // Ajouter message user à l'historique
  aiHistory.push({role:'user',content:userMsg});

  // Afficher immédiatement le message user
  const msgsEl=document.getElementById('ai-msgs');
  if(msgsEl){
    msgsEl.innerHTML+=`
    <div class="ai-msg user">
      <div class="ai-avatar user">👤</div>
      <div class="ai-bubble user">${userMsg.replace(/</g,'&lt;')}</div>
    </div>
    <div class="ai-msg" id="ai-typing-indicator">
      <div class="ai-avatar bot">✦</div>
      <div class="ai-bubble bot"><div class="ai-typing"><div class="ai-dot"></div><div class="ai-dot"></div><div class="ai-dot"></div></div></div>
    </div>`;
    scrollAIChat();
  }

  // Désactiver le bouton
  const btn=document.getElementById('ai-btn');
  if(btn)btn.disabled=true;

  try{
    const systemPrompt=buildPortfolioContext();

    // Construire les messages (system + historique)
    const messages=aiHistory.map(m=>({role:m.role,content:m.content}));

    // Groq API — 100% gratuit, pas de proxy nécessaire
    const resp=await fetch('https://api.groq.com/openai/v1/chat/completions',{
      method:'POST',
      headers:{
        'Content-Type':'application/json',
        'Authorization':'Bearer '+CLAUDE_KEY
      },
      body:JSON.stringify({
        model:'llama-3.3-70b-versatile',
        max_tokens:1000,
        messages:[
          {role:'system',content:systemPrompt},
          ...messages
        ]
      })
    });

    const data=await resp.json();
    if(!resp.ok){
      const errMsg=data?.error?.message||`Erreur HTTP ${resp.status}`;
      throw new Error(errMsg);
    }
    const reply=data?.choices?.[0]?.message?.content||"Désolé, je n'ai pas pu traiter votre demande.";

    // Ajouter réponse à l'historique
    aiHistory.push({role:'assistant',content:reply});

    // Remplacer indicateur de frappe par la vraie réponse
    const typingEl=document.getElementById('ai-typing-indicator');
    if(typingEl){
      typingEl.outerHTML=`
      <div class="ai-msg" style="animation:fadeInUp 0.3s ease">
        <div class="ai-avatar bot">✦</div>
        <div class="ai-bubble bot">${formatAIMessage(reply)}</div>
      </div>`;
    }

  }catch(err){
    // Retirer le dernier message user de l'historique si erreur
    if(aiHistory[aiHistory.length-1]?.role==='user') aiHistory.pop();
    const typingEl=document.getElementById('ai-typing-indicator');
    if(typingEl)typingEl.outerHTML=`
    <div class="ai-msg">

async function fetchNewsForTicker(ticker){
  const isBtc=ticker==='BTC';
  const isEth=ticker==='ETH';
  const price=isBtc&&S.btc>0?`Prix actuel : ${f(S.btc,0)}€`:isEth&&S.eth>0?`Prix actuel : ${f(S.eth,0)}€`:'';
  const today=new Date().toLocaleDateString('fr-FR',{day:'numeric',month:'long',year:'numeric'});

  const prompt=`Tu es un journaliste financier expert. Aujourd'hui nous sommes le ${today}.${price?' '+price:''}
Génère 3 actualités RÉCENTES et RÉALISTES pour "${ticker}" basées sur les tendances actuelles du marché.
Pour BTC/ETH : parle de réglementation crypto, adoption institutionnelle, prix, ETFs, macro.
Pour les actions/ETFs : parle de résultats, analyse, secteur, macro-économie européenne/mondiale.
Varie les sentiments (pas que du positif). Sois précis et crédible.
Réponds UNIQUEMENT en JSON strict, sans markdown, sans texte avant ou après :
{"articles":[
{"title":"titre accrocheur max 10 mots","summary":"2-3 phrases précises et informatives","sentiment":"positive|negative|neutral","source":"Financial Times|Bloomberg|Reuters|Les Echos|BFM Bourse|CoinDesk|L'Agefi","date":"date en français ex: 17 avril 2026"},
{"title":"...","summary":"...","sentiment":"...","source":"...","date":"..."},
{"title":"...","summary":"...","sentiment":"...","source":"...","date":"..."}
]}`;

  const resp=await fetch('https://api.groq.com/openai/v1/chat/completions',{
    method:'POST',
    headers:{'Content-Type':'application/json','Authorization':'Bearer '+CLAUDE_KEY},
    body:JSON.stringify({
      model:'llama-3.3-70b-versatile',
      max_tokens:700,
      temperature:0.75,
      messages:[{role:'user',content:prompt}]
    })
  });
  const data=await resp.json();
  const text=data?.choices?.[0]?.message?.content||'{}';
  try{
    const clean=text.replace(/```json[\s\S]*?```|```/g,'').trim();
    const parsed=JSON.parse(clean);
    return parsed;
  }catch(e){
    // Try to extract JSON from the response
    const match=text.match(/\{[\s\S]*\}/);
    if(match)try{return JSON.parse(match[0]);}catch(e2){}
    return {articles:[]};
  }
}

function newsCardHTML(ticker,data,isLoading){
  const sentColor={positive:'#00D4AA',negative:'#FF4D6A',neutral:'rgba(255,255,255,0.5)'};
  const sentIcon={positive:'↑',negative:'↓',neutral:'→'};
  const sentBg={positive:'rgba(0,212,170,0.08)',negative:'rgba(255,77,106,0.08)',neutral:'rgba(255,255,255,0.04)'};

  if(isLoading) return `
    <div class="card" style="padding:16px">
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:14px">
        <div style="font-size:13px;font-weight:700;color:#fff">${ticker}</div>
        <div style="height:1px;flex:1;background:rgba(255,255,255,0.06)"></div>
        <div class="spin" style="width:14px;height:14px;border-width:2px"></div>
      </div>
      ${[1,2,3].map(()=>`
      <div style="height:56px;border-radius:10px;margin-bottom:8px;background:linear-gradient(90deg,rgba(255,255,255,0.04) 25%,rgba(255,255,255,0.07) 50%,rgba(255,255,255,0.04) 75%);background-size:200% 100%;animation:shimmer 1.5s infinite"></div>`).join('')}
    </div>`;

  const articles=data?.articles||[];
  if(!articles.length) return `
    <div class="card" style="padding:16px">
      <div style="font-size:13px;font-weight:700;color:#fff;margin-bottom:8px">${ticker}</div>
      <div style="font-size:12px;color:rgba(255,255,255,0.25);text-align:center;padding:16px 0">Aucune actualité disponible</div>
    </div>`;

  // Sentiment global
  const sentiments=articles.map(a=>a.sentiment);
  const pos=sentiments.filter(s=>s==='positive').length;
  const neg=sentiments.filter(s=>s==='negative').length;
  const globalSent=pos>neg?'positive':neg>pos?'negative':'neutral';

  const isBtcCard=ticker==='BTC';
  const tickerColor=isBtcCard?'#F7931A':ticker==='ETH'?'#A78BFA':'#fff';
  const cardBorder=isBtcCard?'border-color:rgba(247,147,26,0.2)':'';
  return `
  <div class="card" style="padding:16px;margin-bottom:0;${cardBorder}">
    <div style="display:flex;align-items:center;gap:8px;margin-bottom:14px">
      <div style="font-size:15px;font-weight:800;color:${tickerColor}">${isBtcCard?'₿ ':''}${ticker}</div>
      ${isBtcCard&&S.btc>0?`<div style="font-size:10px;color:rgba(247,147,26,0.6);font-weight:600">${f(S.btc,0)}€</div>`:''}
      <div style="height:1px;flex:1;background:rgba(255,255,255,0.06)"></div>
      <div style="font-size:10px;font-weight:700;color:${sentColor[globalSent]};background:${sentBg[globalSent]};padding:3px 8px;border-radius:6px">${sentIcon[globalSent]} ${globalSent==='positive'?'Positif':globalSent==='negative'?'Négatif':'Neutre'}</div>
    </div>
    ${articles.map(a=>`
    <div style="margin-bottom:10px;padding:12px;background:${sentBg[a.sentiment]};border:1px solid ${sentColor[a.sentiment]}22;border-radius:12px;border-left:3px solid ${sentColor[a.sentiment]}">
      <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:8px;margin-bottom:5px">
        <div style="font-size:12px;font-weight:600;color:#fff;line-height:1.4">${a.title}</div>
        <div style="font-size:9px;color:${sentColor[a.sentiment]};font-weight:700;flex-shrink:0">${sentIcon[a.sentiment]}</div>
      </div>
      <div style="font-size:11px;color:rgba(255,255,255,0.5);line-height:1.55;margin-bottom:6px">${a.summary}</div>
      <div style="display:flex;gap:8px;font-size:9px;color:rgba(255,255,255,0.25)">
        <span>${a.source||''}</span><span>·</span><span>${a.date||''}</span>
      </div>
    </div>`).join('')}
  </div>`;
}

async function loadNewsCard(ticker){
  const el=document.getElementById('news-card-'+ticker);
  if(!el)return;
  if(newsCache[ticker]){
    el.innerHTML=newsCardHTML(ticker,newsCache[ticker],false);
    return;
  }
  el.innerHTML=newsCardHTML(ticker,null,true);
  const data=await fetchNewsForTicker(ticker);
  newsCache[ticker]=data;
  // Re-check element still exists (user may have navigated away)
  const el2=document.getElementById('news-card-'+ticker);
  if(el2)el2.innerHTML=newsCardHTML(ticker,data,false);
}

function showNewsTicker(ticker){
  loadNewsCard(ticker);
}

    </div>

</div>`;

  scrollLearnChat();
}

function learnMsgHTML(m){
  const isBot=m.role==='assistant';
  if(isBot){
    // Highlight la question finale
    const formatted=formatLearnMessage(m.content);
    return`<div style="display:flex;gap:10px;align-items:flex-start;animation:fadeUp 0.2s ease">
      <div style="width:30px;height:30px;border-radius:50%;background:rgba(167,139,250,0.15);border:1px solid rgba(167,139,250,0.25);display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0">🎓</div>
      <div style="max-width:88%;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.08);border-radius:4px 18px 18px 18px;padding:13px 15px;font-size:13px;line-height:1.65;color:rgba(255,255,255,0.88)">${formatted}</div>
    </div>`;
  }
  // User message + feedback badge
  const feedbackBadge=m.feedback?`<div style="font-size:10px;font-weight:700;color:${m.feedback==='correct'?'#00D4AA':m.feedback==='presque'?'#F7931A':'#FF4D6A'};margin-bottom:4px">${m.feedback==='correct'?'✓ Correct +'+m.points+'pts':m.feedback==='presque'?'~ Presque':'✗ Incorrect'}</div>`:'';
  return`<div style="display:flex;flex-direction:row-reverse;gap:10px;align-items:flex-start;animation:fadeUp 0.2s ease">
    <div style="width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.1);display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0">👤</div>
    <div style="max-width:88%;text-align:right">
      ${feedbackBadge}
      <div style="background:rgba(167,139,250,0.12);border:1px solid rgba(167,139,250,0.2);border-radius:18px 4px 18px 18px;padding:12px 15px;font-size:13px;line-height:1.65;color:#D4BBFF;display:inline-block;text-align:left">${m.content}</div>
    </div>
  </div>`;
}

function formatLearnMessage(text){
  return text
    .replace(/\*\*(.*?)\*\*/g,'<strong style="color:#A78BFA">$1</strong>')
    .replace(/\*(.*?)\*/g,'<em style="color:#00D4AA;font-style:normal;font-weight:600">$1</em>')
    .replace(/❓(.*?)$/gm,'<div style="margin-top:10px;padding:10px 12px;background:rgba(167,139,250,0.08);border:1px solid rgba(167,139,250,0.2);border-radius:10px;font-size:12px;color:#C4A8FF;font-weight:600">❓$1</div>')
    .replace(/

/g,'<br><br>').replace(/
/g,'<br>');
}

function scrollLearnChat(){
  requestAnimationFrame(()=>{
    const el=document.getElementById('learn-msgs');
    if(el)el.scrollTop=el.scrollHeight;
  });
}

function sendLearnMsgFromInput(){
  const el=document.getElementById('learn-in');
  if(!el)return;
  const txt=el.value.trim();
  if(!txt)return;
  el.value='';
  el.style.height='44px';
  sendLearnMsg(txt);
}

async function sendLearnMsg(userMsg){
  learnState.session.push({role:'user',content:userMsg});

  // Add typing indicator
  const typingId='learn-typing-'+Date.now();
  const msgsEl=document.getElementById('learn-msgs');
  if(msgsEl){
    msgsEl.innerHTML+=`
    <div id="${typingId}" style="display:flex;gap:10px;align-items:flex-start">
      <div style="width:30px;height:30px;border-radius:50%;background:rgba(167,139,250,0.15);border:1px solid rgba(167,139,250,0.25);display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0">🎓</div>
      <div style="background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.08);border-radius:4px 18px 18px 18px;padding:13px 15px">
        <div style="display:flex;gap:4px;align-items:center"><div class="ai-dot"></div><div class="ai-dot"></div><div class="ai-dot"></div></div>
      </div>
    </div>`;
    // Also add user msg render
    const userEl=document.createElement('div');
    userEl.innerHTML=learnMsgHTML({role:'user',content:userMsg});
    msgsEl.insertBefore(userEl.firstElementChild, document.getElementById(typingId));
    scrollLearnChat();
  }

  const btn=document.getElementById('learn-btn');
  if(btn)btn.disabled=true;

  const theme=LEARN_THEMES.find(t=>t.id===learnState.theme);
  const lvl=LEARN_LEVELS[learnState.level];
  const portfolio=S.pos.filter(p=>p.assets?.type!=='cash').map(p=>p.assets?.ticker).filter(Boolean).join(', ')||'Bitcoin, ETF CW8';

  const systemPrompt=`Tu es un coach financier pédagogue. Niveau : ${lvl.label}. Portefeuille de l'utilisateur : ${portfolio}.
${learnState.theme==='libre'?'Mode libre.':'Thème : '+(theme?.label||'Finance')+'.'}
Réponds en max 150 mots. Évalue la réponse (si c'est une réponse à une question), explique, puis pose UNE nouvelle question précédée de "❓".
Format : evaluation courte > explication > ❓ question. Utilise **gras** pour les termes importants.
Réponds en JSON : {"reply":"...", "feedback":"correct|presque|incorrect|none", "points":0}
Points : correct=10, presque=5, incorrect=0, none=0`;

  const messages=learnState.session.map(m=>({role:m.role,content:m.content}));

  try{
    const resp=await fetch('https://api.groq.com/openai/v1/chat/completions',{
      method:'POST',
      headers:{'Content-Type':'application/json','Authorization':'Bearer '+CLAUDE_KEY},
      body:JSON.stringify({
        model:'llama-3.3-70b-versatile',
        max_tokens:400,
        temperature:0.6,
        messages:[{role:'system',content:systemPrompt},...messages]
      })
    });
    const data=await resp.json();
    let text=data?.choices?.[0]?.message?.content||'{}';
    text=text.replace(/```json|```/g,'').trim();
    let parsed={reply:'Désolé, je n\'ai pas pu répondre.',feedback:'none',points:0};
    try{parsed=JSON.parse(text);}catch(e){parsed.reply=text;}

    // Update score & streak
    if(parsed.feedback==='correct'){learnState.streak++;learnState.correctAnswers++;learnState.score+=parsed.points||10;}
    else if(parsed.feedback==='presque'){learnState.streak=Math.max(0,learnState.streak-0);learnState.score+=parsed.points||5;}
    else if(parsed.feedback==='incorrect'){learnState.streak=0;}
    if(parsed.feedback!=='none')learnState.totalQuestions++;

    // Update user msg feedback
    const lastUserIdx=learnState.session.map(m=>m.role).lastIndexOf('user');
    if(lastUserIdx>=0&&parsed.feedback!=='none'){
      learnState.session[lastUserIdx].feedback=parsed.feedback;
      learnState.session[lastUserIdx].points=parsed.points||0;
    }

    learnState.session.push({role:'assistant',content:parsed.reply});

    // Remove typing indicator and re-render chat
    const typingEl=document.getElementById(typingId);
    if(typingEl)typingEl.remove();

    // Append bot message
    if(msgsEl){
      // Re-render last user with feedback
      renderLearnChat();
    }

  }catch(err){
    const typingEl=document.getElementById(typingId);
    if(typingEl)typingEl.outerHTML=`<div style="font-size:12px;color:#FF4D6A;padding:8px">Erreur de connexion. Réessayez.</div>`;
  }finally{
    const btn2=document.getElementById('learn-btn');
    if(btn2)btn2.disabled=false;
    scrollLearnChat();
  }
}

// ── PULL TO REFRESH ─────────────────────────────────────
  (function initPTR(){
    let startY=0,pulling=false,dy=0,ind=null;
    const THRESHOLD=70;

    function mkInd(){
      if(ind)return;
      ind=document.createElement('div');
      ind.innerHTML='<span id="ptr-icon">↓</span>';
      Object.assign(ind.style,{
        position:'fixed',top:'0',left:'50%',
        transform:'translateX(-50%) translateY(-56px)',
        width:'42px',height:'42px',
        background:'rgba(247,147,26,0.12)',
        border:'1px solid rgba(247,147,26,0.25)',
        borderRadius:'50%',
        display:'flex',alignItems:'center',justifyContent:'center',
        fontSize:'20px',color:'#F7931A',
        zIndex:'9999',willChange:'transform',
        boxShadow:'0 4px 16px rgba(247,147,26,0.15)',
        pointerEvents:'none',
      });
      document.body.appendChild(ind);
    }

    document.addEventListener('touchstart',e=>{
      if(window.scrollY===0&&e.touches.length===1){
        startY=e.touches[0].clientY; pulling=true; mkInd();
      }
    },{passive:true});

    document.addEventListener('touchmove',e=>{
      if(!pulling||!ind)return;
      dy=Math.max(0,e.touches[0].clientY-startY);
      const p=Math.min(dy/THRESHOLD,1);
      const ty=-56+dy*0.42;
      ind.style.transform='translateX(-50%) translateY('+ty+'px) rotate('+(p*180)+'deg)';
      ind.style.opacity=String(Math.min(p*1.4,1));
      ind.style.background=p>=1?'rgba(247,147,26,0.22)':'rgba(247,147,26,0.10)';
    },{passive:true});

    document.addEventListener('touchend',async e=>{
      if(!pulling||!ind)return;
      const releaseDy=e.changedTouches[0].clientY-startY;
      pulling=false;
      if(releaseDy>=THRESHOLD){
        const icon=ind.querySelector('#ptr-icon');
        if(icon)icon.style.cssText='display:inline-block;width:18px;height:18px;border:2.5px solid rgba(247,147,26,0.3);border-top-color:#F7931A;border-radius:50%;animation:sp 0.7s linear infinite;font-size:0';
        ind.style.transition='transform 0.2s cubic-bezier(0.23,1,0.32,1)';
        ind.style.transform='translateX(-50%) translateY(16px)';
        await loadData();
        render();
        fetchCrypto();
        fetchMarketIndices();
        fetchStocksBackground();
      }
      ind.style.transition='transform 0.3s ease,opacity 0.25s ease';
      ind.style.transform='translateX(-50%) translateY(-56px)';
      ind.style.opacity='0';
      setTimeout(()=>{if(ind){ind.remove();ind=null;}},320);
      dy=0;
    },{passive:true});
  })();

})();
