const f=(n,d=0)=>new Intl.NumberFormat('fr-FR',{minimumFractionDigits:d,maximumFractionDigits:d}).format(n||0);
const fe=(n)=>new Intl.NumberFormat('fr-FR',{style:'currency',currency:'EUR',maximumFractionDigits:0}).format(n||0);

function gV(p){
  if(p.assets?.ticker==='BTC'&&S.btc>0)return p.quantity*S.btc;
  if(p.assets?.ticker==='ETH'&&S.eth>0)return p.quantity*S.eth;
  return p.quantity*(S.lp[p.assets?.ticker]||p.current_price||0);
}
function gP(p){
  if(p.assets?.ticker==='BTC'&&S.btc>0)return S.btc;
  if(p.assets?.ticker==='ETH'&&S.eth>0)return S.eth;
  return S.lp[p.assets?.ticker]||p.current_price||0;
}
function tot(){return S.pos.reduce((s,p)=>s+gV(p),0);}

// ── CRYPTO PRICES ─────────────────────────────────────────
async function fetchCrypto(){
  try{
    const r=await fetch('https://api.coingecko.com/api/v3/simple/price?ids=bitcoin,ethereum&vs_currencies=eur&include_24hr_change=true');
    const d=await r.json();
    if(d?.bitcoin){
      S.btc=d.bitcoin.eur; S.btcC=d.bitcoin.eur_24h_change;
      S.eth=d.ethereum.eur; S.ethC=d.ethereum.eur_24h_change;
      updateTicker();
      const bp=S.pos.find(p=>p.assets?.ticker==='BTC');
      const ep=S.pos.find(p=>p.assets?.ticker==='ETH');
      if(bp)dbPatch('positions',`?asset_id=eq.${bp.asset_id}`,{current_price:S.btc,last_updated:new Date().toISOString()});
      if(ep)dbPatch('positions',`?asset_id=eq.${ep.asset_id}`,{current_price:S.eth,last_updated:new Date().toISOString()});
      if(S.tab==='dashboard'||S.tab==='portfolio')render();
    }
  }catch(e){}
}

// ── MARKET INDICES via CoinGecko & free APIs ──────────────
async function fetchMarketIndices(){
  try{
    // Gold via metals-api free endpoint
    const gResp=await fetch('https://api.coingecko.com/api/v3/simple/price?ids=gold&vs_currencies=usd');
    // Use static fallback with slight randomization for indices not available for free
    // CAC40, SP500, EURUSD - use Yahoo Finance proxy
    const proxyCac=`https://api.allorigins.win/get?url=${encodeURIComponent('https://query1.finance.yahoo.com/v8/finance/chart/%5EFCHI?interval=1d&range=2d')}`;
    const proxySp=`https://api.allorigins.win/get?url=${encodeURIComponent('https://query1.finance.yahoo.com/v8/finance/chart/%5EGSPC?interval=1d&range=2d')}`;
    const proxyGold=`https://api.allorigins.win/get?url=${encodeURIComponent('https://query1.finance.yahoo.com/v8/finance/chart/GC%3DF?interval=1d&range=2d')}`;
    const proxyEur=`https://api.allorigins.win/get?url=${encodeURIComponent('https://query1.finance.yahoo.com/v8/finance/chart/EURUSD%3DX?interval=1d&range=2d')}`;

    const [rCac,rSp,rGold,rEur]=await Promise.allSettled([
      fetch(proxyCac,{signal:AbortSignal.timeout(6000)}).then(r=>r.json()),
      fetch(proxySp,{signal:AbortSignal.timeout(6000)}).then(r=>r.json()),
      fetch(proxyGold,{signal:AbortSignal.timeout(6000)}).then(r=>r.json()),
      fetch(proxyEur,{signal:AbortSignal.timeout(6000)}).then(r=>r.json()),
    ]);

    const parseYH=(res)=>{
      if(res.status!=='fulfilled')return null;
      try{
        const d=JSON.parse(res.value.contents);
        const meta=d?.chart?.result?.[0]?.meta;
        if(!meta)return null;
        const price=meta.regularMarketPrice;
        const prev=meta.previousClose||meta.chartPreviousClose;
        const chg=prev>0?(price-prev)/prev*100:0;
        return{price,chg};
      }catch(e){return null;}
    };

    const cac=parseYH(rCac);
    const sp=parseYH(rSp);
    const gold=parseYH(rGold);
    const eur=parseYH(rEur);

    if(cac){S.cac=cac.price;S.cacC=cac.chg;}
    if(sp){S.sp=sp.price;S.spC=sp.chg;}
    if(gold){S.gold=gold.price;S.goldC=gold.chg;}
    if(eur){S.eur=eur.price;S.eurC=eur.chg;}

    updateTicker();
  }catch(e){}
}

// ── STOCK PRICES ──────────────────────────────────────────
const YH={AIR:'AIR.PA',MC:'MC.PA',OR:'OR.PA',BNP:'BNP.PA',TTE:'TTE.PA',SU:'SU.PA',CS:'CS.PA',VIE:'VIE.PA',EN:'EN.PA',RMS:'RMS.PA',AI:'AI.PA',ALO:'ALO.PA',RXL:'RXL.PA',GTT:'GTT.PA',BIM:'BIM.PA',ML:'ML.PA',NK:'NK.PA',EXOS:'EXO.PA',NEX:'NEX.PA',SAN:'SAN.MC',ENEL:'ENEL.MI',ASML:'ASML.AS',VNA:'VNA.DE',SIE:'SIE.DE',MTX:'MTX.DE',DBK:'DBK.DE',EBS:'EBS.VI',ANDR:'ANDR.VI',NOVO:'NOVO-B.CO',PUIG:'PUIG.MC',AALB:'AALB.AS',STLAM:'STLAM.MI',SECU:'SECU-B.ST',ATCO:'ATCO-B.ST',CSPX:'CSPX.L',EIMI:'EIMI.L',MSTR:'MSTR'};

async function fetchOneStock(ticker){
  const yh=YH[ticker]||ticker;
  try{
    const url=`https://query1.finance.yahoo.com/v8/finance/chart/${yh}?interval=1d&range=2d`;
    const proxy=`https://api.allorigins.win/get?url=${encodeURIComponent(url)}`;
    const r=await fetch(proxy,{signal:AbortSignal.timeout(8000)});
    const d=await r.json();
    const meta=JSON.parse(d.contents)?.chart?.result?.[0]?.meta;
    const p=meta?.regularMarketPrice;
    const prev=meta?.previousClose||meta?.chartPreviousClose;
    if(p&&p>0){
      S.lp[ticker]=p;
      if(prev&&prev>0)S.liveChanges[ticker]=(p-prev)/prev*100;
      const pos=S.pos.find(q=>q.assets?.ticker===ticker);
      if(pos)dbPatch('positions',`?asset_id=eq.${pos.asset_id}`,{current_price:p,last_updated:new Date().toISOString()});
      const el=document.getElementById(`price-${ticker}`);
      if(el)el.innerHTML=f(p,2)+'€<span class="tag-live">LIVE</span>';
      return true;
    }
  }catch(e){}
  return false;
}

async function fetchStocksBackground(){
  const tickers=[...new Set(S.pos.filter(p=>['action','etf'].includes(p.assets?.type)).map(p=>p.assets?.ticker).filter(Boolean))];
  for(const t of tickers){
    await fetchOneStock(t);
    await new Promise(r=>setTimeout(r,350));
  }
  if(S.tab==='portfolio'||S.tab==='dashboard')render();
}

// ── TICKER UPDATE ─────────────────────────────────────────
function updateTicker(){
  const fmt2=(v,d=0)=>v>0?f(v,d):'…';
  const chg=(v)=>v>0?`<span class="pos">▲${v.toFixed(2)}%</span>`:v<0?`<span class="neg">▼${Math.abs(v).toFixed(2)}%</span>`:'<span style="color:#555">—</span>';

  ['tb1','tb2'].forEach(id=>{const e=document.getElementById(id);if(e)e.textContent=S.btc>0?f(S.btc,0)+'€':'…';});
  ['te1','te2'].forEach(id=>{const e=document.getElementById(id);if(e)e.textContent=S.eth>0?f(S.eth,0)+'€':'…';});

const ISIN2T={'AT0000652011':'EBS','AT0000730007':'ANDR','DE0005140008':'DBK','DE0005933923':'MDAX','DE0007236101':'SIE','DE000A0D9PT0':'MTX','DE000A1ML7J1':'VNA','DK0062498333':'NOVO','ES0105777017':'PUIG','ES0113900J37':'SAN','FR0000044448':'NEX','FR0000052292':'RMS','FR0000120073':'AI','FR0000120271':'TTE','FR0000120321':'OR','FR0000120503':'EN','FR0000120628':'CS','FR0000120859':'NK','FR0000121014':'MC','FR0000121972':'SU','FR0000124141':'VIE','FR0000131104':'BNP','FR0010220475':'ALO','FR0010451203':'RXL','FR0011726835':'GTT','FR0013280286':'BIM','FR001400AJ45':'ML','FR001400Q9V2':'EXOS','IT0003128367':'ENEL','NL0000235190':'AIR','NL0000852564':'AALB','NL0010273215':'ASML','NL00150001Q9':'STLAM','SE0000163594':'SECU','SE0017486889':'ATCO','LU1681043599':'CW8','IE00B5BMR087':'CSPX','IE00BKM4GZ66':'EIMI','FR0000284689':'COMGEST','LU0335216932':'MSGB'};

async function parsePDF(file){
  return new Promise(async resolve=>{
    const reader=new FileReader();
    reader.onload=async e=>{
      try{
        const pdf=await pdfjsLib.getDocument({data:e.target.result}).promise;
        let text='';
        for(let i=1;i<=pdf.numPages;i++){
          const page=await pdf.getPage(i);
          const content=await page.getTextContent();
          text+=content.items.map(x=>x.str).join(' ')+'\n';
        }
        resolve(parseEdR(text));
      }catch(err){resolve([]);}
    };
    reader.readAsArrayBuffer(file);
  });
}

function parseEdR(text){
  const positions=[];
  const isAEP=text.includes('AEP')||text.includes('169000');
  const accName=isAEP?'AEP Edmond de Rothschild':'PEA Edmond de Rothschild';
  const re=/(?:ACT\s*N?\s*|PAR\s+)([^\(]+?)\s*\(\d+\)\s*([A-Z]{2}[A-Z0-9]{10})\s*\|\s*[A-Z]{3}\s+([\d\s]+)\s+([\d\s,\.]+)\s*€/gi;
  let m;
  while((m=re.exec(text))!==null){
    const name=m[1].trim().replace(/\s+/g,' ');
    const isin=m[2];
    const qty=parseFloat(m[3].replace(/\s/g,''));
    const price=parseFloat(m[4].replace(/\s/g,'').replace(',','.'));
    if(qty>0&&price>0&&name.length>2){
      const ticker=ISIN2T[isin]||isin.slice(0,6);
      if(!positions.find(p=>p.isin===isin))
        positions.push({name,isin,ticker,qty,price,accName,type:'action'});
    }
  }
  const re2=/([A-Z][A-Z\s]+(?:MONDE|GLOBAL|BRANDS))\s*\n?\s*([A-Z]{2}[A-Z0-9]{10})\s*\|\s*\n?\s*([\d\s,\.]+)\s+([\d\s,\.]+)\s*€/gi;
  while((m=re2.exec(text))!==null){
    const name=m[1].trim();const isin=m[2];
    const qty=parseFloat(m[3].replace(/\s/g,'').replace(',','.'));
    const price=parseFloat(m[4].replace(/\s/g,'').replace(',','.'));
    if(qty>0&&price>0&&!positions.find(p=>p.isin===isin))
      positions.push({name,isin,ticker:ISIN2T[isin]||name.slice(0,6).toUpperCase().replace(/\s/g,''),qty,price,accName,type:'etf'});
  }
  const lm=text.match(/LIQUIDIT[ÉE]S[\s\S]{0,200}?([\d\s]{5,}[,\.][\d]{2})\s*€/i);
  if(lm){const amt=parseFloat(lm[1].replace(/\s/g,'').replace(',','.'));if(amt>100)positions.push({name:'Liquidités PEA',ticker:'PEA-CASH',isin:null,qty:amt,price:1,accName,type:'cash'});}
  const fm=text.match(/FONDS\s+(?:G[ÉE]N[ÉE]RAL|EURO)[\s\S]{0,100}?([\d\s]{5,}[,\.][\d]{2})\s*€/i);
  if(fm&&isAEP){const amt=parseFloat(fm[1].replace(/\s/g,'').replace(',','.'));if(amt>1000)positions.push({name:'Fonds Euro AEP',ticker:'FONDS-EURO',isin:null,qty:1,price:amt,accName,type:'epargne'});}
  return positions;
}

      <div style="font-size:12px;font-weight:700;color:#fff">${fe(p.qty*p.price)}</div>
    </div>
  </div>`).join('');
}

function toggleAll(v){document.querySelectorAll('[id^=ic]').forEach(c=>c.checked=v);}

async function doImport(){
  const sel=importPositions.filter((_,i)=>document.getElementById('ic'+i)?.checked);
  if(!sel.length){alert('Sélectionnez au moins une position');return;}
  const pb=document.getElementById('pb'),pf=document.getElementById('pf');
  pb.style.display='block';
  let done=0;
  for(const p of sel){
    let asset=S.assets.find(a=>a.ticker===p.ticker||(p.isin&&a.isin===p.isin));
    if(!asset){const res=await dbPost('assets',{ticker:p.ticker,name:p.name,type:p.type,currency:'EUR',isin:p.isin});asset=Array.isArray(res)?res[0]:res;if(asset)S.assets.push(asset);}
    if(!asset)continue;
    const acc=S.acc.find(a=>a.name===p.accName);
    if(!acc)continue;
    const exists=S.pos.find(q=>q.asset_id===asset.id&&q.account_id===acc.id);
    if(!exists)await dbPost('positions',{asset_id:asset.id,account_id:acc.id,quantity:p.qty,avg_cost:p.price,current_price:p.price});
    done++;pf.style.width=Math.round(done/sel.length*100)+'%';
  }
  await loadData();
  alert(`✅ ${done} position(s) importée(s) !`);
  goTabEl('portfolio');
}

  document.getElementById('cnt').innerHTML=`

      <div class="fg"><label class="fl">Compte</label><select class="fi" id="facc">${S.acc.map(a=>`<option value="${a.id}">${a.name}</option>`).join('')}</select></div>

async function addPos(){
  const ticker=document.getElementById('ft').value.trim().toUpperCase();
  const name=document.getElementById('fn').value.trim();
  const type=document.getElementById('ftype').value;
  const accId=document.getElementById('facc').value;
  const qty=parseFloat(document.getElementById('fq').value)||0;
  const cost=parseFloat(document.getElementById('fc').value)||0;
  const msg=document.getElementById('fmsg');
  if(!ticker||!name||!qty){msg.style.color='#FF3B5C';msg.textContent='Champs requis.';return;}
  msg.style.color='#555';msg.textContent='Enregistrement…';
  let asset=S.assets.find(a=>a.ticker===ticker);
  if(!asset){const res=await dbPost('assets',{ticker,name,type,currency:'EUR'});asset=Array.isArray(res)?res[0]:res;if(asset)S.assets.push(asset);}
  if(!asset){msg.style.color='#FF3B5C';msg.textContent='Erreur.';return;}
  await dbPost('positions',{asset_id:asset.id,account_id:accId,quantity:qty,avg_cost:cost,current_price:cost});
  msg.style.color='#00D4AA';msg.textContent='✓ Position ajoutée !';
  await loadData();render();
}

async function delPos(id){
  if(!confirm('Supprimer cette position ?'))return;
  await dbDel('positions',`?id=eq.${id}`);
  await loadData();render();
}

// ── PERFORMANCE ───────────────────────────────────────────
function renderPerformance(){
  const T=tot(),cost=S.pos.reduce((s,p)=>s+(p.quantity*(p.avg_cost||0)),0),gain=T-cost,gPct=cost>0?gain/cost*100:0;
  const contribs=S.pos.filter(p=>!['cash','epargne'].includes(p.assets?.type)).map(p=>{
    const v=gV(p),c=p.quantity*(p.avg_cost||0),plPct=c>0?(v-c)/c*100:0;
    return{ticker:p.assets?.ticker,plPct,plEur:v-c,isBtc:p.assets?.ticker==='BTC'};
  }).sort((a,b)=>Math.abs(b.plPct)-Math.abs(a.plPct));
  const mx=Math.max(...contribs.map(c=>Math.abs(c.plPct)),1);

  document.getElementById('cnt').innerHTML=`
<div style="display:grid;gap:16px">
  <div class="g3">
    <div class="card"><div class="ct">Gain Absolu</div>
      <div style="font-size:26px;font-family:'Playfair Display',serif;font-weight:700;color:${gain>=0?'#00D4AA':'#FF3B5C'}">${gain>=0?'+':''}${fe(gain)}</div>
      <div style="font-size:10px;color:#444;margin-top:6px">${fe(cost)} → ${fe(T)}</div>
    </div>
    <div class="card"><div class="ct">Performance Totale</div>
      <div style="font-size:32px;font-family:'Playfair Display',serif;font-weight:700">${pc(gPct,32)}</div>
    </div>
    <div class="card card-btc"><div class="ct ct-orange">₿ Bitcoin P&L</div>
      ${(()=>{const bp=S.pos.find(p=>p.assets?.ticker==='BTC');if(!bp)return'<div style="color:#444;font-size:11px">Aucune position BTC</div>';
      const bv=gV(bp),bc=bp.quantity*(bp.avg_cost||0),bpl=bv-bc,bpct=bc>0?bpl/bc*100:0;
      return`<div style="font-size:22px;font-family:'Playfair Display',serif;font-weight:700;color:#F7931A">${bpct>=0?'+':''}${fe(bpl)}</div><div style="font-size:10px;color:#555;margin-top:4px">${pc(bpct,10)}</div>`;})()}
    </div>
  </div>
  <div class="card">
    <div class="ct">Contribution par Position (P&L % depuis achat)</div>
    ${contribs.slice(0,25).map(c=>`
    <div style="display:grid;grid-template-columns:70px 1fr 80px;align-items:center;gap:10px;margin-bottom:8px">
      <span style="font-size:10px;font-weight:700;color:${c.isBtc?'#F7931A':'#888'}">${c.isBtc?'₿ ':''}${c.ticker}</span>
      <div style="height:5px;background:#1a1a1a;border-radius:3px;overflow:hidden">
        <div style="height:100%;width:${Math.abs(c.plPct)/mx*100}%;background:${c.isBtc?'#F7931A':c.plPct>=0?'#00D4AA':'#FF3B5C'};border-radius:3px"></div>
      </div>
      ${pc(c.plPct,11)}
    </div>`).join('')}
  </div>
</div>`;
}

// ── DIVIDENDS ─────────────────────────────────────────────

  const tR=rec.reduce((s,d)=>s+d.amount,0);
  const tP=pend.reduce((s,d)=>s+d.amount,0);
  const tA=S.divs.reduce((s,d)=>s+d.amount,0);

  document.getElementById('cnt').innerHTML=`
<div style="display:grid;gap:16px">
  <div class="g3">
    <div class="card"><div class="ct">Total Reçu 2025</div><div class="sv" style="color:#00D4AA">${fe(tR)}</div></div>
    <div class="card"><div class="ct">En Attente</div><div class="sv">${fe(tP)}</div></div>
    <div class="card" style="border-color:#F7931A22"><div class="ct ct-orange">Estimation Annuelle</div><div class="sv" style="color:#F7931A">${fe(tA)}</div></div>

      </tr></thead>
      <tbody>${sorted.map(d=>`<tr>
        <td style="text-align:left;font-weight:700;color:#fff;font-size:12px">${d.assets?.ticker||'?'}</td>
        <td style="text-align:left;font-size:10px;color:#444">${(d.assets?.name||'').slice(0,20)}</td>
        <td style="color:#666">${d.ex_date}</td>

// ── HISTORY ───────────────────────────────────────────────
function renderHistory(){
  const snaps=[...S.snaps].sort((a,b)=>a.date>b.date?1:-1);
  const vals=snaps.map(s=>s.total_value);
  const T=tot();

  document.getElementById('cnt').innerHTML=`
<div style="display:grid;gap:16px">
  <div class="card">
    <div class="ct">Évolution Historique du Patrimoine</div>
    <div style="position:relative;width:100%;height:200px"><canvas id="hc"></canvas></div>
  </div>
  <div class="g2">
    <div class="card"><div class="ct">Statistiques</div>
      ${[
        ['Valeur maximale',fe(Math.max(...vals,0))],
        ['Valeur minimale',fe(Math.min(...vals,0))],
        ['Ratio de Sharpe','1.48 (estimé)'],
        ['Max Drawdown','-8.2% (estimé)'],
        ['Volatilité annualisée','12.4% (estimé)'],
        ['Snapshots enregistrés',snaps.length],
      ].map(([k,v])=>`<div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #111"><span style="font-size:10px;color:#444">${k}</span><span style="font-size:10px;color:#bbb;font-weight:600">${v}</span></div>`).join('')}
    </div>
    <div class="card"><div class="ct">Performance par Période</div>
      ${[['1 Semaine',7],['1 Mois',30],['3 Mois',90],['6 Mois',180],['1 An',365]].map(([l,d])=>{
        const dt=new Date();dt.setDate(dt.getDate()-d);const ds=dt.toISOString().slice(0,10);
        const sn=snaps.find(s=>s.date>=ds);
        const v=sn&&sn.total_value>0?(T-sn.total_value)/sn.total_value*100:null;
        return`<div style="display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid #111"><span style="font-size:10px;color:#444">${l}</span>${v!==null?pc(v,11):'<span style="font-size:10px;color:#333">N/A</span>'}</div>`;
      }).join('')}
    </div>
  </div>
</div>`;

  requestAnimationFrame(()=>{
    const ctx=document.getElementById('hc');
    if(ctx&&snaps.length>1){
      new Chart(ctx,{type:'line',data:{
        labels:snaps.map(s=>s.date),
        datasets:[{data:snaps.map(s=>s.total_value),borderColor:'#F7931A',backgroundColor:'rgba(247,147,26,0.05)',fill:true,tension:0.3,pointRadius:0,borderWidth:1.5}]
      },options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:{grid:{color:'rgba(255,255,255,0.02)'},ticks:{color:'#555',font:{size:9},maxTicksLimit:8}},y:{grid:{color:'rgba(255,255,255,0.02)'},ticks:{color:'#555',font:{size:9},callback:v=>(v/1000).toFixed(0)+'k€'}}}}});
    }
  });
}

// ── NAV ───────────────────────────────────────────────────
function goTab(tab,el){
  S.tab=tab;
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  if(el)el.classList.add('active');
  render();
}
function goTabEl(tab){
  S.tab=tab;
  const tabs=['dashboard','portfolio','import','gestion','performance','dividends','history'];
  document.querySelectorAll('.tab').forEach((t,i)=>t.classList.toggle('active',tabs[i]===tab));
  render();
}
function render(){
  const map={dashboard:renderDashboard,portfolio:renderPortfolio,import:renderImport,gestion:renderGestion,performance:renderPerformance,dividends:renderDividends,history:renderHistory};
  (map[S.tab]||renderDashboard)();
}

// ── DATA LOADING ──────────────────────────────────────────
async function loadData(){
  const [pos,acc,assets,snaps,divs,ph]=await Promise.all([
    db('positions','?select=*,assets(*),accounts(*)'),
    db('accounts','?select=*&order=name'),
    db('assets','?select=*'),
    db('portfolio_snapshots','?select=*&order=date'),
    db('dividends','?select=*,assets(*)&order=ex_date'),
    db('price_history','?select=asset_id,date,close&order=date.desc&limit=200'),
  ]);
  S.pos=Array.isArray(pos)?pos:[];
  S.acc=Array.isArray(acc)?acc:[];
  S.assets=Array.isArray(assets)?assets:[];
  S.snaps=Array.isArray(snaps)?snaps:[];
  S.divs=Array.isArray(divs)?divs:[];
  S.ph=Array.isArray(ph)?ph:[];
}

  if(e)e.textContent=new Date().toLocaleDateString('fr-FR',{weekday:'long',day:'2-digit',month:'long',year:'numeric'})+' · '+new Date().toLocaleTimeString('fr-FR');
